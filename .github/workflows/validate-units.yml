name: Validate units

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-units:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate units
        run: npm run validate-units
